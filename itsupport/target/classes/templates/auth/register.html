<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>IT Support — Εγγραφή</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-icon">🖥</span>
            <h1>IT Support</h1>
            <p>Δημιουργία Λογαριασμού</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/auth/register}" method="post" class="auth-form">
            <div class="form-group">
                <label>Ονοματεπώνυμο</label>
                <input type="text" name="fullName" placeholder="π.χ. Γιώργος Παπαδόπουλος" class="form-control"/>
            </div>
            <div class="form-group">
                <label>Τμήμα</label>
                <input type="text" name="department" placeholder="π.χ. Sales, HR, Accounting" class="form-control"/>
            </div>
            <div class="form-group">
                <label>Username *</label>
                <input type="text" name="username" placeholder="Επιλέξτε username" required class="form-control"/>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" placeholder="email@company.gr" required class="form-control"/>
            </div>
            <div class="form-group">
                <label>Κωδικός *</label>
                <input type="password" name="password" placeholder="Τουλάχιστον 6 χαρακτήρες" required class="form-control"/>
            </div>
            <button type="submit" class="btn-primary btn-full">Εγγραφή</button>
        </form>

        <p class="auth-switch">
            Έχετε λογαριασμό; <a th:href="@{/auth/login}">Συνδεθείτε</a>
        </p>
    </div>
</div>
</body>
</html>
